<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>让我吃一口 · 摄影作品集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============ 基础重置 ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ============ 方正强克体（本地内嵌） ============ */
@font-face {
  font-family: "FZQiangKe";
  src: url("assets/fonts/FZQiangK.ttf") format("truetype");
  font-weight: 100 900;
  font-display: swap;
}

:root {
  --bg: #000;
  --text: #9a9a9a;
  --text-bright: #f2f2f2;
  --line: #262626;
  --frame: #1c1c1c;
  --width: 900px;
  /* 方正强克体（内嵌）；加载失败时回退到系统无衬线 */
  --font: "FZQiangKe", "FZQiangKeTiS", "方正强克体", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 90px;
}

a { color: var(--text); text-decoration: none; transition: color .25s ease; }
a:hover { color: var(--text-bright); }

/* ============ 顶部导航（复刻参考站：左对齐、底部分隔线） ============ */
.nav {
  width: var(--width);
  max-width: calc(100vw - 48px);
  margin: 42px auto 0;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px 34px;
}

.nav .brand {
  font-size: 1.35em;
  color: var(--text-bright);
  letter-spacing: .02em;
  margin-right: 18px;
}

.nav .nav-links { display: flex; gap: 34px; flex-wrap: wrap; }
.nav .nav-links a { font-size: .95em; }
.nav .nav-links a.active { color: var(--text-bright); }

/* ============ 主体容器 ============ */
.container {
  width: var(--width);
  max-width: calc(100vw - 48px);
  margin: 0 auto;
}

/* ============ 首页大图（完整呈现，不裁切） ============ */
.hero {
  margin-top: 34px;
}
.hero img {
  width: 100%;
  height: auto;
  display: block;
  border: 1px solid var(--frame);
}

/* 区块标题（细分割线 + 小标题，克制处理） */
.section-head {
  margin: 56px 0 30px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.section-head .title {
  color: var(--text-bright);
  font-size: 1em;
  font-weight: 500;
  letter-spacing: .18em;
  white-space: nowrap;
}
.section-head .rule { flex: 1; height: 1px; background: var(--line); }

/* ============ 作品展示网格（3列，照片原始比例、底边对齐，复刻参考站） ============ */
.works {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 44px 34px;
}
.work {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
}
.work .frame {
  width: 100%;
  height: 280px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.work .frame img {
  max-width: 100%;
  max-height: 280px;
  width: auto;
  height: auto;
  display: block;
  border: 1px solid var(--frame);
  opacity: .88;
  transition: opacity .35s ease, transform .5s ease;
}
.work:hover .frame img { opacity: 1; transform: translateY(-3px); }

/* ============ 视频作品区 ============ */
.videos {
  display: flex;
  flex-direction: column;
  gap: 40px;
}
.video-item video {
  width: 100%;
  display: block;
  border: 1px solid var(--frame);
  background: #000;
}
.video-item video:hover { border-color: #2c2c2c; }

/* ============ 关于（“关于”标题及以下使用宋体） ============ */
.section-head#about .title,
.about,
.about .name,
.about .line,
.footer {
  font-family: "SimSun", "Songti SC", "STSong", "宋体", serif;
}
.about { padding-top: 2px; }
.about .name {
  color: var(--text-bright);
  font-size: 2.1em;
  font-weight: 400;
  letter-spacing: .12em;
  margin-bottom: 26px;
}
.about .line {
  color: #b8b8b8;
  font-size: 1.05em;
  line-height: 2.35;
  letter-spacing: .06em;
}

/* ============ 页脚 ============ */
.footer {
  width: var(--width);
  max-width: calc(100vw - 48px);
  margin: 72px auto 0;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  font-size: .78em;
  color: #666;
  letter-spacing: .05em;
}

/* ============ Toast 占位提示 ============ */
.toast {
  position: fixed;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%) translateY(20px);
  background: #161616;
  color: #ddd;
  border: 1px solid #2c2c2c;
  padding: 10px 22px;
  font-size: .85em;
  letter-spacing: .06em;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease, transform .3s ease;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ 灯箱（点击作品看大图） ============ */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.94);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 90;
  padding: 40px;
}
.lightbox.show { display: flex; }
.lightbox img { max-width: 100%; max-height: 88vh; width: auto; height: auto; border: 1px solid var(--frame); }
.lightbox .close {
  position: absolute;
  top: 24px;
  right: 32px;
  color: #888;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
}
.lightbox .close:hover { color: #fff; }

/* ============ 响应式 ============ */
@media (max-width: 760px) {
  .works { grid-template-columns: repeat(2, 1fr); gap: 34px 20px; }
  .work .frame { height: 230px; }
  .work .frame img { max-height: 230px; }
  /* 两列布局下最后一张孤卡居中，避免单独悬在左侧 */
  .work:last-child:nth-child(odd) {
    grid-column: 1 / -1;
    width: calc(50% - 10px);
    justify-self: center;
  }
  .nav { margin-top: 30px; gap: 8px 20px; }
  .nav .nav-links { gap: 22px; }
}
@media (max-width: 460px) {
  .works { grid-template-columns: 1fr; gap: 30px; }
  .work .frame { height: 320px; }
  .work .frame img { max-height: 320px; }
  .nav .brand { margin-right: 0; width: 100%; }
}
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<nav class="nav">
  <a class="brand" href="#top">让我吃一口</a>
  <div class="nav-links">
    <a href="#works" class="active">作品</a>
    <a href="#videos">视频作品</a>
    <a href="#about">关于</a>
  </div>
</nav>

<!-- ===== 首页大图 + 作品网格 ===== -->
<main class="container" id="top">

  <!-- 首页大图 -->
  <section class="hero">
    <img src="assets/hero.jpg" alt="首页大图">
  </section>

  <!-- 作品展示区 -->
  <div class="section-head" id="works">
    <span class="title">作品</span>
    <span class="rule"></span>
  </div>

  <section class="works">
    <button class="work" data-img="assets/work-01.jpg" aria-label="作品 1">
      <span class="frame"><img src="assets/work-01.jpg" alt="作品 1"></span>
    </button>
    <button class="work" data-img="assets/work-02.jpg" aria-label="作品 2">
      <span class="frame"><img src="assets/work-02.jpg" alt="作品 2"></span>
    </button>
    <button class="work" data-img="assets/work-03.jpg" aria-label="作品 3">
      <span class="frame"><img src="assets/work-03.jpg" alt="作品 3"></span>
    </button>
    <button class="work" data-img="assets/work-04.jpg" aria-label="作品 4">
      <span class="frame"><img src="assets/work-04.jpg" alt="作品 4"></span>
    </button>
    <button class="work" data-img="assets/work-05.jpg" aria-label="作品 5">
      <span class="frame"><img src="assets/work-05.jpg" alt="作品 5"></span>
    </button>
    <button class="work" data-img="assets/work-06.jpg" aria-label="作品 6">
      <span class="frame"><img src="assets/work-06.jpg" alt="作品 6"></span>
    </button>
    <button class="work" data-img="assets/work-07.jpg" aria-label="作品 7">
      <span class="frame"><img src="assets/work-07.jpg" alt="作品 7"></span>
    </button>
    <button class="work" data-img="assets/work-08.jpg" aria-label="作品 8">
      <span class="frame"><img src="assets/work-08.jpg" alt="作品 8"></span>
    </button>
    <button class="work" data-img="assets/work-09.jpg" aria-label="作品 9">
      <span class="frame"><img src="assets/work-09.jpg" alt="作品 9"></span>
    </button>
  </section>

  <!-- 视频作品区 -->
  <div class="section-head" id="videos">
    <span class="title">视频作品</span>
    <span class="rule"></span>
  </div>

  <section class="videos">
    <div class="video-item">
      <video controls preload="metadata" playsinline poster="assets/video-0822-poster.jpg">
        <source src="assets/video-0822-web.mp4" type="video/mp4">
      </video>
    </div>
    <div class="video-item">
      <video controls preload="metadata" playsinline poster="assets/video-0925-poster.jpg">
        <source src="assets/video-0925-web.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <!-- 关于 -->
  <div class="section-head" id="about">
    <span class="title">关于</span>
    <span class="rule"></span>
  </div>

  <section class="about">
    <h2 class="name">邝宇凡</h2>
    <p class="line">来自广东广州 在校大学生</p>
    <p class="line">2023年接触摄影 喜欢将情感表达融入到作品中</p>
    <p class="line">主要拍摄题材为人文纪实、人像以及创意短片</p>
  </section>

</main>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <span>© 2026 让我吃一口 · 保留所有权利</span>
  <span>联系：kyfrank208@gmail.com</span>
</footer>

<!-- ===== 灯箱 ===== -->
<div class="lightbox" id="lightbox">
  <button class="close" id="lbClose" aria-label="关闭">×</button>
  <img id="lbImg" src="" alt="">
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<script>
(function () {
  // Toast
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  document.querySelectorAll('[data-toast]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      showToast(el.getAttribute('data-toast'));
    });
  });

  // 灯箱
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  document.querySelectorAll('.work').forEach(function (el) {
    el.addEventListener('click', function () {
      lbImg.src = el.getAttribute('data-img');
      lb.classList.add('show');
    });
  });
  function closeLb() { lb.classList.remove('show'); lbImg.src = ''; }
  document.getElementById('lbClose').addEventListener('click', closeLb);
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
})();
</script>
</body>
</html>
